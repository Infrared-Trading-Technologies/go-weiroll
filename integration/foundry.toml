[profile.default]
src = "contracts"
out = "out"
libs = []
solc_version = "0.8.19"
# MintAdapter.mintFlat takes 11 args + builds an 11-field struct — too
# many locals for the legacy codegen's stack. via_ir uses Yul's
# liveness analysis and resolves it categorically. Optimizer is on so
# bytecode size stays reasonable.
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
